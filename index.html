<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X-ADV 750 e casco Joker</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--muted:#556}
    body{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;line-height:1.4;margin:0;background:var(--bg);color:#111}
    main{max-width:900px;margin:3rem auto;padding:2rem;background:linear-gradient(180deg,var(--card),#fafafa);border-radius:12px;box-shadow:0 6px 30px rgba(16,24,40,0.06)}
    h1{font-size:1.6rem;margin:0 0 .25rem}
    p.lead{color:var(--muted);margin:0 0 1rem}
    .images{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-top:1rem}
    figure{margin:0;text-align:center}
    img{display:block;max-width:320px;height:auto;border-radius:8px;box-shadow:0 6px 18px rgba(2,6,23,0.08)}
    figcaption{margin-top:.5rem;color:#334155;font-size:.95rem}
    footer{margin-top:1.5rem;text-align:center;color:#64748b;font-size:.85rem}
  </style>
</head>
<body>
  <main>
    <h1>X-ADV 750 — Honda</h1>
    <p class="lead">Ecco un esempio visivo: la X-ADV 750 e un casco in stile "Joker" (illustrazione stilizzata).</p>

    <div class="images">
      <figure>
        <img src="images/xadv750.svg" alt="X-ADV 750">
        <figcaption>X-ADV 750 (illustrazione)</figcaption>
      </figure>

      <figure>
        <img src="images/casco-joker.svg" alt="Casco Joker">
        <figcaption>Casco Joker (illustrazione)</figcaption>
      </figure>
    </div>

    <footer>Immagini create come SVG semplici per esempio.</footer>
  </main>
</body>
</html>
